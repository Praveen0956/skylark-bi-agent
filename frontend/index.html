<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skylark BI Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --bg:#0f1115; --panel:#171a21; --accent:#4f8dfd; --text:#e6e8ec; --muted:#8b93a1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 20px 16px 12px; border-bottom: 1px solid #262a33; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 2px; }
  .msg.loading { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #262a33; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2b303b; background: var(--panel); color: var(--text); font-size: 14px; }
  input:focus { outline: 1px solid var(--accent); }
  button { padding: 12px 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skylark BI Agent</h1>
    <p>Ask about deals or work orders — pulled live from monday.com.</p>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="e.g. How's our pipeline for the energy sector this quarter?" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  let history = [];

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    const loadingEl = addMessage('Thinking…', 'bot loading');
    form.querySelector('button').disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });
      const data = await res.json();
      loadingEl.remove();
      if (data.error) {
        addMessage('Error: ' + data.error, 'bot');
      } else {
        addMessage(data.reply, 'bot');
        history = data.history;
      }
    } catch (err) {
      loadingEl.remove();
      addMessage('Network error: ' + err.message, 'bot');
    } finally {
      form.querySelector('button').disabled = false;
    }
  });
</script>
</body>
</html>
